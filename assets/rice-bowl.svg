<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <defs>
    <!-- Metallic gradient for the iron basin -->
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd8dc" />
      <stop offset="35%" stop-color="#90a4ae" />
      <stop offset="70%" stop-color="#607d8b" />
      <stop offset="100%" stop-color="#455a64" />
    </linearGradient>
    <linearGradient id="ironRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eceff1" />
      <stop offset="50%" stop-color="#b0bec5" />
      <stop offset="100%" stop-color="#78909c" />
    </linearGradient>
    <!-- Rice mound gradient -->
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f5f5f5" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
    <!-- Chopsticks gradient -->
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8" />
      <stop offset="100%" stop-color="#8d6e63" />
    </linearGradient>
  </defs>

  <!-- Steam effects -->
  <path d="M45,22 Q40,12 45,5 Q48,0 45,-2" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M60,18 Q65,10 60,3 Q57,-2 60,-5" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="3" stroke-linecap="round" />
  <path d="M75,22 Q70,12 75,5 Q78,0 75,-2" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Piled High White Rice Mound -->
  <ellipse cx="60" cy="50" rx="46" ry="24" fill="url(#riceGrad)" />
  <path d="M16,50 C16,24 35,16 60,16 C85,16 104,24 104,50 Z" fill="url(#riceGrad)" />
  
  <!-- Fluffy rice texture dots -->
  <circle cx="48" cy="32" r="3" fill="#ffffff" />
  <circle cx="56" cy="26" r="3.5" fill="#ffffff" />
  <circle cx="68" cy="28" r="3" fill="#ffffff" />
  <circle cx="78" cy="35" r="3" fill="#ffffff" />
  <circle cx="38" cy="40" r="3" fill="#ffffff" />
  <circle cx="62" cy="38" r="3.5" fill="#ffffff" />
  <circle cx="72" cy="44" r="3" fill="#ffffff" />
  <circle cx="50" cy="46" r="3" fill="#ffffff" />
  <circle cx="86" cy="44" r="2.5" fill="#ffffff" />

  <!-- Chopsticks -->
  <polygon points="75,12 79,10 98,62 94,63" fill="url(#stickGrad)" />
  <polygon points="70,15 74,13 103,58 99,60" fill="url(#stickGrad)" />

  <!-- The Iron Basin Body (铁盆) -->
  <path d="M10,50 Q12,88 60,88 Q108,88 110,50 Z" fill="url(#ironGrad)" stroke="#37474f" stroke-width="2" />
  <!-- Basin Rim -->
  <ellipse cx="60" cy="50" rx="50" ry="8" fill="url(#ironRim)" stroke="#37474f" stroke-width="1.5" />
  <!-- Highlights on basin body -->
  <path d="M22,58 Q24,78 45,83" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" />
  <!-- Little whale logo on the basin (matching her apron) -->
  <path d="M54,68 C56,66 61,66 64,68 C66,69 67,71 65,72 C62,73 57,73 55,71 C53,70 53,69 54,68 Z M64,68 C66,66 67,65 68,66 C67,67 66,68 65,69 Z" fill="#ffffff" opacity="0.8" />
</svg>
