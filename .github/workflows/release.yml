# Publishes a GitHub Release when a version tag (v*) is pushed.
# The archive matches scripts/package-release.ps1 (lib, assets, docs without
# handover notes, install scripts and top-level documents) plus a SHA-256 file.
# Release notes are docs/releases/<tag>.md (bilingual); an existing release is
# never overwritten. Pushing the tag is the owner's release approval.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version and notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${TAG}" ]; then echo "package.json is ${VERSION}, tag is ${TAG}"; exit 1; fi
          test -f "docs/releases/${TAG}.md"
          node --check lib/client.js

      - name: Build archive
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ZIP="dsh-whale-pet-${TAG}.zip"
          STAGE="$(mktemp -d)"
          cp -r lib assets "${STAGE}/"
          cp package.json cordis.yml install.bat uninstall.bat README.md CHANGELOG.md ASSETS_LICENSE.md CONTRIBUTING.md LICENSE "${STAGE}/"
          mkdir "${STAGE}/docs"
          for entry in docs/*; do
            name="$(basename "${entry}")"
            case "${name}" in handover|*_REVIEW_IMPLEMENTATION.md) continue ;; esac
            cp -r "${entry}" "${STAGE}/docs/"
          done
          (cd "${STAGE}" && zip -qr -X "${GITHUB_WORKSPACE}/${ZIP}" .)
          sha256sum "${ZIP}" > "${ZIP}.sha256"
          cat "${ZIP}.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/releases/${TAG}.md"
          TITLE="$(head -n 1 "${NOTES}" | sed -E 's/^# +//; s/^(v[0-9.]+) · /\1 · 大肥鱼 — /')"
          if gh release view "${TAG}" >/dev/null 2>&1; then echo "Release ${TAG} already exists; not overwriting."; exit 1; fi
          gh release create "${TAG}" "dsh-whale-pet-${TAG}.zip" "dsh-whale-pet-${TAG}.zip.sha256" \
            --title "${TITLE}" --notes-file "${NOTES}" --verify-tag
