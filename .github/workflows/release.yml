# Only version tags publish; ordinary source pushes do not create a Release.
# Publish exactly the Windows-built archives that passed the smoke checks.
name: Release

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - name: Check version and release notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$version" -ne $env:GITHUB_REF_NAME) { throw 'Version tag does not match package.json' }
          if (-not (Test-Path -LiteralPath "docs/releases/v$version.md")) { throw 'Missing release notes' }

      - name: Build and check source
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check lib/client.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check Windows launchers
        shell: powershell
        run: ./tests/install.test.ps1

      - name: Build and verify both download archives
        shell: powershell
        run: |
          & ./scripts/package-release.ps1
          $tag = "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)"
          & ./tests/package-release.test.ps1 -PackagePath "dist/dsh-whale-pet-$tag.zip"

      - name: Build the click-to-run desktop companion
        shell: pwsh
        run: |
          pnpm run package:desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not (Test-Path -LiteralPath 'dist/DaFeiYu-win32-x64/DaFeiYu.exe')) { throw 'DaFeiYu.exe was not built' }
          if (Get-ChildItem -LiteralPath 'dist/DaFeiYu-win32-x64' -Recurse -Include '*.moc3', '*.model3.json' | Select-Object -First 1) { throw 'The desktop package must not contain a Live2D model' }
          $zip = "dist/dsh-whale-pet-desktop-v$version-win-x64.zip"
          Compress-Archive -Path 'dist/DaFeiYu-win32-x64/*' -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $(Split-Path -Leaf $zip)`n", [Text.UTF8Encoding]::new($false))

      - name: Keep checked candidates
        uses: actions/upload-artifact@v4
        with:
          name: checked-release-downloads
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "docs/releases/$tag.md"
          $title = (Get-Content -LiteralPath $notes -Encoding UTF8 -TotalCount 1) -replace '^# +', ''
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; not overwriting" }
          gh release create $tag "dist/dsh-whale-pet-$tag.zip" "dist/dsh-whale-pet-$tag.zip.sha256" "dist/dsh-whale-pet-installer-fix-$tag.zip" "dist/dsh-whale-pet-installer-fix-$tag.zip.sha256" "dist/dsh-whale-pet-desktop-$tag-win-x64.zip" "dist/dsh-whale-pet-desktop-$tag-win-x64.zip.sha256" --title $title --notes-file $notes --verify-tag
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
