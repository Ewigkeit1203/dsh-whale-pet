# Only version tags publish; ordinary source pushes do not create a Release.
# Publish exactly the Windows-built archives that passed the smoke checks.
name: Release

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - name: Check version and release notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$version" -ne $env:GITHUB_REF_NAME) { throw 'Version tag does not match package.json' }
          if (-not (Test-Path -LiteralPath "docs/releases/v$version.md")) { throw 'Missing release notes' }

      - name: Build and check source
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check lib/client.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check Windows launchers
        shell: powershell
        run: ./tests/install.test.ps1

      - name: Build and verify both download archives
        shell: powershell
        run: |
          & ./scripts/package-release.ps1
          $tag = "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)"
          & ./tests/package-release.test.ps1 -PackagePath "dist/dsh-whale-pet-$tag.zip"

      - name: Build and verify the desktop app archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm run package:desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tag = "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)"
          $app = 'dist/DaFeiYu-win32-x64'
          node scripts/verify-desktop-package.cjs $app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Not -LiteralPath with -Include: Windows PowerShell ignores -Include there and matches every file.
          $models = @(Get-ChildItem -LiteralPath $app -Recurse -File | Where-Object { $_.Name -like '*.moc3' -or $_.Name -like '*.model3.json' })
          if ($models.Count) { throw 'User model data found outside ASAR' }
          $zip = "dist/dsh-whale-pet-desktop-$tag-win-x64.zip"
          Compress-Archive -Path "$app/*" -DestinationPath $zip -Force
          # Check the download after extraction too; the ASAR verifier compares every runtime byte.
          $checked = Join-Path $env:RUNNER_TEMP ('whale-desktop-' + [Guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $zip -DestinationPath $checked
          node scripts/verify-desktop-package.cjs $checked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The download carries the project's licenses and the Live2D third-party notices.
          foreach ($notice in 'LICENSE.txt', 'ASSETS_LICENSE.md', 'THIRD_PARTY_NOTICES.md') { if (-not (Test-Path -LiteralPath (Join-Path $checked "notices/$notice"))) { throw "Missing notices/$notice in the desktop download" } }

      # The downloads are exactly this version's plugin and desktop ZIPs, named explicitly (never dist/*.zip):
      # no checksum side files (GitHub shows each asset's digest). The installer-fix ZIP is still built and
      # tested above for old plugin folders, but no longer attached; v0.8.2's identical one stays available.
      - name: Check the download list
        shell: pwsh
        run: |
          $tag = "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)"
          foreach ($name in "dsh-whale-pet-$tag.zip", "dsh-whale-pet-desktop-$tag-win-x64.zip") { if (-not (Test-Path -LiteralPath "dist/$name")) { throw "Missing download: $name" } }
          $sums = @(Get-ChildItem -LiteralPath dist -Recurse -File -Filter '*.sha256')
          if ($sums.Count) { throw "Checksum side files must not be produced: $($sums.Name -join ', ')" }
          "TAG_VERSION=$tag" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Keep checked candidates
        uses: actions/upload-artifact@v4
        with:
          name: checked-release-downloads
          if-no-files-found: error
          path: |
            dist/dsh-whale-pet-${{ env.TAG_VERSION }}.zip
            dist/dsh-whale-pet-desktop-${{ env.TAG_VERSION }}-win-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "docs/releases/$tag.md"
          $title = (Get-Content -LiteralPath $notes -Encoding UTF8 -TotalCount 1) -replace '^# +', ''
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; not overwriting" }
          gh release create $tag "dist/dsh-whale-pet-$tag.zip" "dist/dsh-whale-pet-desktop-$tag-win-x64.zip" --title $title --notes-file $notes --verify-tag
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
